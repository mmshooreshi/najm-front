name: Build and Deploy Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Nuxt
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Verify build output
        run: |
          test -f .output/server/index.mjs
          test -d .output/public

      - name: Package release
        run: |
          tar -czf "najm-${GITHUB_SHA}.tar.gz" \
            .output \
            package.json \
            pnpm-lock.yaml

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.NAJM_DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/najm_deploy
          chmod 600 ~/.ssh/najm_deploy

          ssh-keyscan -H "${{ secrets.NAJM_DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload release
        run: |
          scp \
            -i ~/.ssh/najm_deploy \
            -o IdentitiesOnly=yes \
            "najm-${GITHUB_SHA}.tar.gz" \
            "${{ secrets.NAJM_DEPLOY_USER }}@${{ secrets.NAJM_DEPLOY_HOST }}:/srv/deploy/najm/incoming/"

      - name: Deploy release
        run: |
          ssh \
            -i ~/.ssh/najm_deploy \
            -o IdentitiesOnly=yes \
            "${{ secrets.NAJM_DEPLOY_USER }}@${{ secrets.NAJM_DEPLOY_HOST }}" \
            "/srv/deploy/najm/deploy.sh /srv/deploy/najm/incoming/najm-${GITHUB_SHA}.tar.gz ${GITHUB_SHA}"