name: Build Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: staging-build
  cancel-in-progress: true

jobs:
  build:
    name: Build staging artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Nuxt
        run: pnpm build

      - name: Verify build output
        run: |
          test -f .output/server/index.mjs
          test -d .output/public

      - name: Package release
        run: |
          tar -czf najm-${GITHUB_SHA}.tar.gz .output package.json pnpm-lock.yaml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: najm-staging-${{ github.sha }}
          path: najm-${{ github.sha }}.tar.gz
          retention-days: 7
